name: Build Daily GD Brief

on:
  schedule:
    # 01:00 UTC = 06:30 IST, every day. (GitHub may start it a few minutes late.)
    - cron: "0 1 * * *"
  workflow_dispatch:      # adds the manual "Run workflow" button in the Actions tab

# Lets the workflow push the new JSON files back to the repository.
permissions:
  contents: write

# Never run two builds at the same time (avoids git push conflicts).
concurrency:
  group: daily-gd-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build today's brief
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}   # optional repository variable
        run: python scripts/build_brief.py

      - name: Commit and push the new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing changed, nothing to commit."
          else
            git commit -m "Daily brief: $(TZ=Asia/Kolkata date +%Y-%m-%d)"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push
          fi
