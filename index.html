<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F3F5F8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F1620" media="(prefers-color-scheme: dark)">
  <meta name="description" content="A daily, curated news brief with GD angles for MBA placement preparation.">
  <title>Daily GD Brief</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='%23E5A11B'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    // Apply saved theme before first paint to avoid a flash.
    (function () {
      try {
        var t = localStorage.getItem("gd-theme");
        if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="masthead" href="./" aria-label="Daily GD Brief home">Daily GD Brief</a>
      <div class="topbar-controls">
        <label class="sr-only" for="date-select">Choose a day</label>
        <select id="date-select" class="date-select" aria-label="Choose a day">
          <option value="">Today</option>
        </select>
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch theme" title="Switch theme">
          <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="app" class="page">
    <section class="status" id="status" aria-live="polite">
      <p>Loading today's brief…</p>
    </section>
  </main>

  <footer class="footer">
    <p>Built from free RSS feeds, refreshed every morning by GitHub Actions. Headlines link to the original publishers. AI-written commentary is a study aid, not a substitute for reading the source.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
