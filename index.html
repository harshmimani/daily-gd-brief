<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#1C2147" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#12152E" media="(prefers-color-scheme: dark)">
  <meta name="description" content="A daily, curated news brief with GD angles for MBA placement preparation.">
  <title>The Brief</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="The Brief">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    // Apply saved theme before first paint to avoid a flash.
    (function () {
      try {
        var t = localStorage.getItem("gd-theme");
        if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <div class="kicker" id="day-kicker">Morning edition</div>
      <div class="topbar-controls">
        <label class="sr-only" for="date-select">Choose a day</label>
        <select id="date-select" class="date-select" aria-label="Choose a day">
          <option value="">Today</option>
        </select>
        <button id="saved-btn" class="icon-btn" type="button" aria-label="Saved stories" title="Saved stories">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h12v17l-6-4-6 4z"/></svg>
          <span id="saved-count" class="badge-count" hidden></span>
        </button>
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch theme" title="Switch theme">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
      <h1 class="dateline" id="dateline">&nbsp;</h1>
      <div class="day-meta" id="day-meta"></div>
      <div class="cover" id="cover"></div>
    </div>
  </header>

  <main id="app" class="page">
    <section class="status" id="status" aria-live="polite">
      <p>Loading today's brief…</p>
    </section>
  </main>

  <footer class="footer">
    <p>Built from free RSS feeds, refreshed every morning by GitHub Actions. At most 25 stories a day. Headlines link to the original publishers. AI-written commentary is a study aid, not a substitute for reading the source.</p>
  </footer>

  <script src="app.js"></script>
  <script>
    // Offline reading: cache the shell and the latest brief.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
