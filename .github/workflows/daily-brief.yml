name: Build Daily GD Brief

on:
  schedule:
    # 00:17 UTC = 05:47 IST. Deliberately NOT on the hour: GitHub's scheduler is
    # busiest at :00 and can delay (or drop) runs queued then. The early start
    # also leaves slack, so a late run still lands before you read the brief.
    - cron: "17 0 * * *"
    # Backfill passes: 07:47, 10:17, 13:47 and 18:17 IST. Gemini's free tier is
    # often overloaded (HTTP 503) at dawn IST and clears later in the day. These
    # runs only fill in commentary the morning run missed (today first, then the
    # last 14 days), and exit in seconds when nothing is missing.
    - cron: "17 2 * * *"
    - cron: "47 4 * * *"
    - cron: "17 8 * * *"
    - cron: "47 12 * * *"
  workflow_dispatch:      # adds the manual "Run workflow" button in the Actions tab
    inputs:
      mode:
        description: "build = fresh brief, backfill = only fill missing commentary"
        type: choice
        options: [build, backfill]
        default: build

# Lets the workflow push the new JSON files back to the repository.
permissions:
  contents: write

# Never run two builds at the same time (avoids git push conflicts).
concurrency:
  group: daily-gd-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -u scripts/test_build_brief.py

      - name: Build today's brief
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '17 0 * * *') || (github.event_name == 'workflow_dispatch' && inputs.mode != 'backfill') }}
        timeout-minutes: 20
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: Claude writes the notes when set
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}               # optional, default claude-sonnet-5-5
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}         # Gemini, then Gemma on the same key
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}             # optional free backup (console.groq.com)
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}                    # optional, default openai/gpt-oss-120b
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}   # optional repository variable
          AI_DEADLINE: "600"                        # seconds for the whole Gemini phase
          # SKIP_CURATION: "1"                      # uncomment to save 1 call on a tight quota
        run: python -u scripts/build_brief.py

      - name: Backfill missing commentary
        if: ${{ (github.event_name == 'schedule' && github.event.schedule != '17 0 * * *') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'backfill') }}
        timeout-minutes: 20
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          AI_DEADLINE: "900"
          BACKFILL_DAYS: "14"   # runs exit in seconds when nothing is missing
        run: python -u scripts/build_brief.py --backfill

      - name: Update library, review deck and calendar data
        if: always()
        run: python -u scripts/build_derived.py

      # always() so that a failed or cancelled build still publishes whatever the
      # script managed to write before it stopped (it writes a headlines-only
      # brief before calling Gemini).
      - name: Commit and push the new data
        if: always()
        run: |
          git config user.name "harshmimani"
          git config user.email "84675238+harshmimani@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing changed, nothing to commit."
          else
            if [ "${{ github.event.schedule }}" = "17 0 * * *" ] || [ "${{ inputs.mode }}" = "build" ]; then
              git commit -m "Daily brief: $(TZ=Asia/Kolkata date +%Y-%m-%d)"
            else
              git commit -m "Backfill commentary: $(TZ=Asia/Kolkata date +%Y-%m-%d\ %H:%M)"
            fi
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
