name: Build Daily GD Brief

on:
  schedule:
    # 00:17 UTC = 05:47 IST. Deliberately NOT on the hour: GitHub's scheduler is
    # busiest at :00 and can delay (or drop) runs queued then. The early start
    # also leaves slack, so a late run still lands before you read the brief.
    - cron: "17 0 * * *"
  workflow_dispatch:      # adds the manual "Run workflow" button in the Actions tab

# Lets the workflow push the new JSON files back to the repository.
permissions:
  contents: write

# Never run two builds at the same time (avoids git push conflicts).
concurrency:
  group: daily-gd-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -u scripts/test_build_brief.py

      - name: Build today's brief
        timeout-minutes: 20
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}   # optional repository variable
          AI_DEADLINE: "600"                        # seconds for the whole Gemini phase
          # SKIP_CURATION: "1"                      # uncomment to save 1 call on a tight quota
        run: python -u scripts/build_brief.py

      # always() so that a failed or cancelled build still publishes whatever the
      # script managed to write before it stopped (it writes a headlines-only
      # brief before calling Gemini).
      - name: Commit and push the new data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing changed, nothing to commit."
          else
            git commit -m "Daily brief: $(TZ=Asia/Kolkata date +%Y-%m-%d)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
